{% extends "base.html" %}
{% block content %}
<div class="card auth">
  <h2>Forgot your password?</h2>
  <p class="meta">Enter your account email and we'll send you a reset link.</p>
  <form method="post">{% csrf_token %}
    {{ form.email.errors }}{{ form.email }}
    <button class="btn" type="submit">Send reset link</button>
  </form>
  <p class="meta"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
